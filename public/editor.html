<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>走词台 · 编辑器</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar">
  <span class="brand">🎭 走词台 · 编辑器</span>
  <span class="spacer"></span>
  <a href="/">← 场次列表</a>
  <a id="opLink" href="#">操作员台</a>
  <a id="stageLink" href="#" target="_blank">观众屏</a>
</div>

<div class="container">
  <div class="row" style="justify-content: space-between;">
    <div>
      <h1 id="showName">…</h1>
      <div class="sub">
        当前演出状态：<span id="showStatus"></span>
        <span id="performingInfo" class="muted small"></span>
      </div>
    </div>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connLabel">—</span></div>
  </div>

  <div class="panel">
    <h2>字幕草稿 <span class="muted small">（修改仅进入草稿；已发布版本与演出中的字幕不会被改动）</span></h2>
    <div class="row" style="margin-bottom: 12px;">
      <button id="addBtn" type="button">＋ 新增一条</button>
      <button id="renumberBtn" type="button" title="按当前顺序重排为 1,2,3…">序号重排为连续</button>
      <button id="reloadBtn" type="button">放弃本地修改并重新载入</button>
      <span class="spacer" style="flex:1"></span>
      <span id="dirtyBadge" class="pill" style="display:none">有未保存修改</span>
    </div>
    <div id="entries" class="entries-editor"></div>
    <div class="row" style="margin-top: 14px;">
      <input type="text" id="note" placeholder="版本备注（可选），如：周六场修订" style="flex:1; min-width:220px">
    </div>
    <div class="row" style="margin-top: 14px;">
      <button class="primary" id="saveBtn" type="button">保存草稿</button>
      <button class="primary" id="publishBtn" type="button">发布为新版本</button>
      <span class="muted small">发布生成不可变版本快照；演出进行中不能切换演出版本（需先结束演出）。</span>
    </div>
  </div>

  <div class="panel">
    <h2>已发布版本</h2>
    <table>
      <thead><tr><th>版本</th><th>备注</th><th>条数</th><th>发布时间</th><th></th></tr></thead>
      <tbody id="versionList"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
    </table>
  </div>
</div>

<script src="/common.js"></script>
<script>
const showId = qs('show');
if (!showId) location.href = '/';
document.getElementById('opLink').href = '/operator.html?show=' + showId;
document.getElementById('stageLink').href = '/stage.html?show=' + showId;

let dirty = false;
let lastSavedHash = '';

const $entries = document.getElementById('entries');

function markDirty() {
  dirty = true;
  document.getElementById('dirtyBadge').style.display = '';
}
function clearDirty() {
  dirty = false;
  document.getElementById('dirtyBadge').style.display = 'none';
}

function entryHash() {
  return JSON.stringify(readEntries());
}
function readEntries() {
  return [...$entries.querySelectorAll('.entry-row')].map((row) => ({
    seq: Number(row.querySelector('.seq').value),
    text: row.querySelector('.text').value,
  }));
}

function renderEntries(entries) {
  $entries.innerHTML = '';
  entries.forEach((e) => addRow(e.seq, e.text));
  if (!entries.length) addRow('', '');
  lastSavedHash = JSON.stringify(entries);
  clearDirty();
}

function addRow(seq = '', text = '') {
  const row = document.createElement('div');
  row.className = 'entry-row';
  row.innerHTML = `
    <input class="seq" type="number" min="1" step="1" placeholder="序号" value="${esc(seq)}">
    <input class="text" type="text" placeholder="字幕内容" value="${esc(text)}">
    <button type="button" class="del">删除</button>`;
  row.querySelector('.seq').addEventListener('input', markDirty);
  row.querySelector('.text').addEventListener('input', markDirty);
  row.querySelector('.del').addEventListener('click', () => { row.remove(); markDirty(); });
  $entries.appendChild(row);
}

document.getElementById('addBtn').onclick = () => { addRow(); markDirty(); };
document.getElementById('renumberBtn').onclick = () => {
  $entries.querySelectorAll('.seq').forEach((el, i) => { el.value = i + 1; });
  markDirty();
};
document.getElementById('reloadBtn').onclick = async () => {
  if (dirty && !confirm('本地有未保存修改，确定放弃并重新载入草稿？')) return;
  await loadDraft();
};

async function loadDraft() {
  const { draft } = await api('GET', `/api/shows/${showId}/draft`);
  renderEntries(draft.entries);
}

async function loadVersions() {
  const { versions } = await api('GET', `/api/shows/${showId}/versions`);
  const tbody = document.getElementById('versionList');
  if (!versions.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="muted">尚未发布任何版本。</td></tr>';
    return;
  }
  tbody.innerHTML = versions.map((v) => `
    <tr>
      <td><strong>v${v.version_no}</strong>${v.id === window._performingId ? ' <span class="pill live">演出中</span>' : ''}</td>
      <td>${esc(v.note) || '<span class="muted">—</span>'}</td>
      <td>${v.entry_count}</td>
      <td class="small muted">${new Date(v.created_at).toLocaleString('zh-CN', { hour12: false })}</td>
      <td><a href="#" class="view" data-id="${v.id}">查看内容</a></td>
    </tr>`).join('');
  tbody.querySelectorAll('.view').forEach((a) => a.addEventListener('click', async (e) => {
    e.preventDefault();
    const { version, entries } = await api('GET', `/api/shows/${showId}/versions/${a.dataset.id}`);
    alert(`v${version.version_no}（${version.note || '无备注'}）\n\n` +
      entries.map((x) => `${x.seq}. ${x.text}`).join('\n'));
  }));
}

// 本地校验（与服务端一致，服务端会再次校验）
function validateLocal(entries) {
  if (!entries.length) return '字幕条目不能为空：请至少保留一条字幕';
  const seen = new Set();
  for (const e of entries) {
    if (!Number.isInteger(e.seq) || e.seq <= 0) return `存在无效序号（须为正整数）`;
    if (seen.has(e.seq)) return `序号重复：${e.seq}`;
    if (!String(e.text || '').trim()) return `序号 ${e.seq} 的字幕为空`;
    seen.add(e.seq);
  }
  return null;
}

document.getElementById('saveBtn').onclick = async () => {
  const entries = readEntries();
  const problem = validateLocal(entries);
  if (problem) return toast(problem, 'error');
  try {
    await api('PUT', `/api/shows/${showId}/draft`, {
      entries: entries.map((e) => ({ seq: e.seq, text: String(e.text).trim() })),
    });
    await loadDraft();
    toast('草稿已保存（未影响任何已发布版本）', 'ok');
  } catch (e) { toast(e.message, 'error'); }
};

document.getElementById('publishBtn').onclick = async () => {
  const entries = readEntries();
  const problem = validateLocal(entries);
  if (problem) return toast(problem, 'error');
  if (dirty && !confirm('有未保存修改。将先按保存草稿再发布，继续？')) return;
  try {
    await api('PUT', `/api/shows/${showId}/draft`, {
      entries: entries.map((e) => ({ seq: e.seq, text: String(e.text).trim() })),
    });
    const r = await api('POST', `/api/shows/${showId}/publish`, {
      note: document.getElementById('note').value,
    });
    await loadDraft();
    await loadVersions();
    toast(r.reused ? `内容未变化，仍为已发布的 v${r.version_no}` : `已发布 v${r.version_no}（演出开始时锁定该版本）`, 'ok');
  } catch (e) { toast(e.message, 'error'); }
};

function renderState(s) {
  document.getElementById('showName').textContent = s.show_name;
  const map = {
    performing: '<span class="pill live">演出中</span>',
    ended: '<span class="pill ended">已结束</span>',
    idle: '<span class="pill idle">未开始</span>',
  };
  document.getElementById('showStatus').innerHTML = map[s.status] || s.status;
  window._performingId = s.performing_version ? s.performing_version.id : null;
  document.getElementById('performingInfo').textContent = s.performing_version
    ? `　锁定版本 v${s.performing_version.version_no}（发布后的草稿修改不影响台上）`
    : (s.latest_version ? `　最新版本 v${s.latest_version.version_no}` : '　尚无发布版本');
  loadVersions();
}

const conn = connectShow(showId, { onState: renderState });
conn.setIndicator = (label, on) => {
  document.getElementById('connLabel').textContent = label;
  document.getElementById('connDot').className = 'dot ' + (on ? 'on' : 'off');
};

(async function init() {
  try {
    const [{ state }, { draft }] = await Promise.all([
      api('GET', `/api/shows/${showId}`),
      api('GET', `/api/shows/${showId}/draft`),
    ]);
    renderState(state);
    renderEntries(draft.entries);
  } catch (e) { toast(e.message, 'error'); }
})();

window.addEventListener('beforeunload', (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});
</script>
</body>
</html>
